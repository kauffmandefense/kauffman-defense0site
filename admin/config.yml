backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "inventory"
    label: "Inventory / Products"
    files:
      - name: "products_file"
        label: "Product Catalog"
        file: "products.json"
        description: "Manage physical products and services catalog"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "SKU / Item #", name: "id", widget: "string" }
              - { label: "Title / Model", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string", default: "$0.00" }
              - { label: "Category", name: "category", widget: "select", options: ["Firearms", "Ammunition", "Accessories", "Services"] }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Product Image", name: "image", widget: "image", required: false }
              - { label: "In Stock?", name: "inStock", widget: "boolean", default: true }
